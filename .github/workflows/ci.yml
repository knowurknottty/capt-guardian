name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: capt-guardian-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Audit production dependencies
        run: npm audit --omit=dev
      - name: Verify local MCP latency gate
        run: npm run bench:mcp
      - name: Upload latency evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capt-guardian-local-loopback
          path: artifacts/perf/local-loopback.json
          if-no-files-found: error
